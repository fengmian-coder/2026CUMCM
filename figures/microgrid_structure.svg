<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <style>
      .zh { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "SimHei", sans-serif; fill:#172033; }
      .title { font-size:34px; font-weight:600; letter-spacing:1px; }
      .subtitle { font-size:20px; fill:#667085; }
      .node-title { font-size:27px; font-weight:600; }
      .node-sub { font-size:18px; fill:#667085; }
      .edge-label { font-size:20px; font-weight:500; fill:#344054; }
      .small { font-size:17px; fill:#667085; }
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2F6BFF"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#159A77"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7A8699"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1D2939" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="920" fill="#FFFFFF"/>
  <text x="800" y="58" text-anchor="middle" class="zh title">并网型光伏—储能微网结构及能量关系</text>
  <text x="800" y="92" text-anchor="middle" class="zh subtitle">微网作为统一可控系统，通过并网接口协调外网购电、光伏发电、储能和小区负载</text>

  <!-- Microgrid boundary -->
  <rect x="385" y="132" width="1130" height="665" rx="20" fill="#F8FAFF" stroke="#9BB5ED" stroke-width="2.5"/>
  <rect x="420" y="111" width="240" height="44" rx="22" fill="#315EAD"/>
  <text x="540" y="141" text-anchor="middle" class="zh" font-size="24" font-weight="600" style="fill:#FFFFFF">微网系统边界</text>

  <!-- External grid -->
  <g filter="url(#shadow)">
    <rect x="65" y="335" width="245" height="145" rx="18" fill="#F4F6F8" stroke="#98A2B3" stroke-width="2"/>
  </g>
  <path d="M120 390 H255 M142 390 L165 355 L188 390 L211 355 L234 390" fill="none" stroke="#52606D" stroke-width="5" stroke-linejoin="round"/>
  <text x="188" y="438" text-anchor="middle" class="zh node-title">外部电网</text>
  <text x="188" y="466" text-anchor="middle" class="zh node-sub">系统边界之外</text>

  <!-- PCC -->
  <g filter="url(#shadow)">
    <rect x="445" y="335" width="230" height="145" rx="18" fill="#FFFFFF" stroke="#6B8FD4" stroke-width="2.3"/>
  </g>
  <circle cx="500" cy="392" r="23" fill="#EAF0FF" stroke="#315EAD" stroke-width="3"/>
  <path d="M488 392 H512 M500 380 V404" stroke="#315EAD" stroke-width="4"/>
  <text x="560" y="400" class="zh node-title">并网接口</text>
  <text x="560" y="430" class="zh node-sub">PCC / 计量点</text>

  <!-- Bus -->
  <g filter="url(#shadow)">
    <rect x="790" y="335" width="300" height="145" rx="18" fill="#EAF0FF" stroke="#315EAD" stroke-width="2.8"/>
  </g>
  <line x1="835" y1="382" x2="1045" y2="382" stroke="#315EAD" stroke-width="8" stroke-linecap="round"/>
  <line x1="870" y1="382" x2="870" y2="410" stroke="#315EAD" stroke-width="5"/>
  <line x1="940" y1="382" x2="940" y2="410" stroke="#315EAD" stroke-width="5"/>
  <line x1="1010" y1="382" x2="1010" y2="410" stroke="#315EAD" stroke-width="5"/>
  <text x="940" y="444" text-anchor="middle" class="zh node-title">内部电网 / 等效母线</text>

  <!-- PV -->
  <g filter="url(#shadow)">
    <rect x="505" y="585" width="290" height="145" rx="18" fill="#F1FBF7" stroke="#40A98B" stroke-width="2.3"/>
  </g>
  <circle cx="560" cy="628" r="17" fill="#FDBE3B"/>
  <path d="M560 600 V588 M560 668 V656 M532 628 H520 M600 628 H588 M540 608 L531 599 M589 657 L580 648 M580 608 L589 599 M531 657 L540 648" stroke="#FDBE3B" stroke-width="4"/>
  <path d="M620 608 H740 L724 652 H604 Z M618 630 H732 M645 608 L636 652 M681 608 L676 652 M716 608 L716 652" fill="#DCE9FF" stroke="#315EAD" stroke-width="3"/>
  <text x="650" y="692" text-anchor="middle" class="zh node-title">光伏发电设备</text>
  <text x="650" y="720" text-anchor="middle" class="zh node-sub">不可控分布式电源</text>

  <!-- Storage -->
  <g filter="url(#shadow)">
    <rect x="1190" y="205" width="250" height="150" rx="18" fill="#FFF8EB" stroke="#D69B2D" stroke-width="2.3"/>
  </g>
  <rect x="1240" y="245" width="70" height="42" rx="7" fill="none" stroke="#B7791F" stroke-width="4"/>
  <rect x="1310" y="257" width="9" height="18" rx="2" fill="#B7791F"/>
  <rect x="1248" y="253" width="45" height="26" rx="3" fill="#F2BD53"/>
  <text x="1330" y="266" class="zh node-title">储能设备</text>
  <text x="1315" y="320" text-anchor="middle" class="zh node-sub">跨时段转移电能</text>

  <!-- Load -->
  <g filter="url(#shadow)">
    <rect x="1190" y="575" width="250" height="150" rx="18" fill="#F3F7FF" stroke="#6B8FD4" stroke-width="2.3"/>
  </g>
  <path d="M1238 653 V612 L1276 583 L1314 612 V653 Z M1254 653 V624 H1272 V653 M1284 620 H1300 V636 H1284 Z" fill="#DCE9FF" stroke="#315EAD" stroke-width="3" stroke-linejoin="round"/>
  <text x="1353" y="632" text-anchor="middle" class="zh node-title">小区负载</text>
  <text x="1315" y="688" text-anchor="middle" class="zh node-sub">必须满足的用电需求</text>

  <!-- Energy flows -->
  <path d="M310 407 H435" fill="none" stroke="#2F6BFF" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="372" y="383" text-anchor="middle" class="zh edge-label">外网购电</text>
  <text x="372" y="433" text-anchor="middle" class="zh small">P<tspan baseline-shift="sub" font-size="13">grid,t</tspan> ≥ 0</text>

  <path d="M675 407 H778" fill="none" stroke="#2F6BFF" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="727" y="383" text-anchor="middle" class="zh edge-label">并网输入</text>

  <path d="M745 585 C780 535, 830 505, 870 486" fill="none" stroke="#159A77" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="785" y="548" text-anchor="middle" class="zh edge-label">光伏出力</text>
  <text x="788" y="574" text-anchor="middle" class="zh small">P<tspan baseline-shift="sub" font-size="13">pv,t</tspan></text>

  <path d="M1090 380 C1138 340, 1150 306, 1180 286" fill="none" stroke="#2F6BFF" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="1122" y="322" class="zh edge-label">充电</text>
  <text x="1122" y="347" class="zh small">P<tspan baseline-shift="sub" font-size="13">ch,t</tspan></text>

  <path d="M1190 330 C1150 355, 1132 399, 1102 420" fill="none" stroke="#2F6BFF" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="1134" y="444" class="zh edge-label">放电</text>
  <text x="1136" y="469" class="zh small">P<tspan baseline-shift="sub" font-size="13">dis,t</tspan></text>

  <path d="M1090 445 C1132 494, 1156 576, 1180 633" fill="none" stroke="#2F6BFF" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="1120" y="545" class="zh edge-label">供电</text>
  <text x="1120" y="570" class="zh small">P<tspan baseline-shift="sub" font-size="13">load,t</tspan></text>

  <!-- EMS -->
  <g filter="url(#shadow)">
    <rect x="810" y="180" width="260" height="92" rx="16" fill="#FFFFFF" stroke="#7A8699" stroke-width="2"/>
  </g>
  <text x="940" y="220" text-anchor="middle" class="zh node-title">能量管理系统</text>
  <text x="940" y="250" text-anchor="middle" class="zh node-sub">预测 · 优化 · 调度</text>
  <path d="M940 272 V325" fill="none" stroke="#7A8699" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-gray)"/>
  <path d="M810 225 C705 226, 620 270, 580 326" fill="none" stroke="#7A8699" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-gray)"/>
  <path d="M1068 224 C1120 220, 1155 230, 1180 250" fill="none" stroke="#7A8699" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-gray)"/>

  <!-- Balance equation -->
  <rect x="455" y="760" width="1020" height="90" rx="14" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/>
  <text x="965" y="798" text-anchor="middle" class="zh edge-label">时段功率平衡（忽略内部线路损耗）</text>
  <text x="965" y="832" text-anchor="middle" class="zh" font-size="25" font-family="Cambria Math, Times New Roman, serif">
    P<tspan baseline-shift="sub" font-size="17">grid,t</tspan> + P<tspan baseline-shift="sub" font-size="17">pv,t</tspan> + P<tspan baseline-shift="sub" font-size="17">dis,t</tspan>
    = P<tspan baseline-shift="sub" font-size="17">load,t</tspan> + P<tspan baseline-shift="sub" font-size="17">ch,t</tspan>
  </text>

  <!-- Legend -->
  <line x1="85" y1="824" x2="155" y2="824" stroke="#2F6BFF" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="170" y="831" class="zh small">电能流</text>
  <line x1="85" y1="865" x2="155" y2="865" stroke="#7A8699" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-gray)"/>
  <text x="170" y="872" class="zh small">信息与控制流</text>

  <text x="800" y="895" text-anchor="middle" class="zh" font-size="19" fill="#475467">图 1  并网型光伏—储能微网结构及能量关系示意图</text>
</svg>
